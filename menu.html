<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeliBot Menú</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/menu.css">
</head>

<body>

  <div class="container">
    <header>
      <h1>DeliBot</h1>
      <p class="subtitle">Delicias tradicionales en tu mesa</p>
      <div class="status-checker">
        <input id="order-id-input" type="text" placeholder="Ingresa tu ID de pedido" aria-label="ID del pedido">
        <button id="status-button" type="button">Consultar estado</button>
        <span class="status-pill" id="order-status-pill">Sin pedido</span>
      </div>
      <div class="search-bar">
        <input id="search-input" type="search" placeholder="Busca platillos, bebidas o postres..." aria-label="Buscar menú">
        <button id="search-button" type="button">Buscar</button>
        <button id="clear-button" type="button">Limpiar</button>
      </div>
    </header>

    <div class="tabs" id="tabs-container">

    </div>

    <div class="menu-grid" id="menu-grid">

    </div>
  </div>


  <div class="fab" id="fab-cart" onclick="toggleDrawer()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
    </svg>
    <div class="badge hidden" id="fab-badge">0</div>
  </div>


  <div class="overlay" id="drawer-overlay" onclick="toggleDrawer()"></div>


  <div class="drawer" id="cart-drawer">
    <div class="drawer-header">
      <h2 class="drawer-title">Tu Pedido</h2>
      <button class="drawer-close" onclick="toggleDrawer()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" width="20" height="20" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="drawer-body" id="cart-items">

    </div>

    <div class="drawer-footer" id="drawer-footer" style="display: none;">
      <div class="total-row">
        <span class="total-label">Subtotal</span>
        <span class="total-value" id="cart-total">$0</span>
      </div>
      <button class="btn-confirm" onclick="confirmOrder()">Confirmar pedido</button>
    </div>
  </div>

  <!-- Empieza todo el JS -->
  <div class="modal-overlay" id="success-modal">
    <div class="modal">
      <div class="modal-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
      </div>
      <h3 class="modal-title">¡Pedido enviado!</h3>
      <p class="modal-desc">Te notificaremos por WhatsApp cuando esté listo 🎉</p>
      <p class="modal-order-id" id="modal-order-id">ID de pedido: <strong>ORD-XXXX</strong></p>
      <button class="btn-confirm" onclick="closeModal()">¡Perfecto!</button>
    </div>
  </div>

  <script src="js/menu.js"></script>
</body>
</html>
