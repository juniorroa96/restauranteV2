<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeliBot Chef - Panel de Pedidos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/chef.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1B6B3A',
                        action: '#E07B1A',
                        'bg-light': '#F4F4F4'
                    },
                    fontFamily: {
                        display: ['"Playfair Display"', 'serif'],
                        body: ['"Outfit"', 'sans-serif']
                    }
                }
            }
        }
    </script>

   
</head>

<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Mobile Header -->
    <div
        class="md:hidden fixed top-0 w-full z-30 bg-white border-b border-slate-200 p-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold text-primary font-display">DeliBot Chef</h1>
        </div>
        <button id="logout-mobile" class="p-2 text-red-600 hover:bg-red-50 rounded-full transition-colors">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v1"></path>
            </svg>
        </button>
    </div>

    <!-- Sidebar -->
    <aside
        class="w-64 bg-white border-r border-slate-200 flex flex-col shadow-lg h-full hidden md:flex">
        <div class="p-6 border-b border-slate-100">
            <h1 class="text-2xl font-bold font-display text-primary flex items-center gap-2">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" class="text-action"
                    viewBox="0 0 24 24">
                    <path d="M14 14.5v1M10 10h.01M6 18h12a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2z"></path>
                </svg>
                DeliBot Chef
            </h1>
            <p class="text-xs text-slate-400 mt-1 uppercase font-bold tracking-wider">Panel de Pedidos</p>
        </div>

        <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
            <button data-target="view-pedidos"
                class="nav-btn w-full flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-all active text-white bg-primary">
                <svg class="mr-3" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                    viewBox="0 0 24 24">
                    <path
                        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01">
                    </path>
                </svg>
                Pedidos
            </button>
        </nav>

        <div class="p-4 border-t border-slate-100">
            <button id="logout-btn"
                class="flex items-center px-4 py-3 text-sm font-medium rounded-xl text-red-600 hover:bg-red-50 transition-colors w-full">
                <svg class="mr-3" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                    viewBox="0 0 24 24">
                    <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v1"></path>
                </svg>
                Cerrar Sesión
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col bg-bg-light mt-16 md:mt-0 pb-0 min-h-0 overflow-auto">

        <!-- PEDIDOS VIEW -->
        <div id="view-pedidos" class="view-section active animate-in p-4 md:p-6">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h2 class="text-2xl font-bold font-display text-slate-800">Pedidos en Vivo</h2>
                    <p class="text-slate-500 text-sm mt-1">Gestiona los pedidos de la cocina</p>
                </div>
                <div class="flex gap-2">
                    <button id="refresh-btn" class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-primary font-semibold transition-colors flex items-center gap-2">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M1 4v6h6M23 20v-6h-6"></path>
                            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
                        </svg>
                        Actualizar
                    </button>
                </div>
            </div>

            <!-- Kanban Board -->
            <div class="flex-1 flex gap-5 overflow-x-auto pb-4 hide-scrollbar snap-x px-1 min-w-0" id="kanban-board">
                <!-- Columns injected here -->
            </div>
        </div>

    </main>

    <script>
        // ==================== FUNCIONES DE SESIÓN ====================
        function checkSession() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            
            if (!currentUser || currentUser.role !== 'cocinero') {
                window.location.href = 'login.html';
                return;
            }
            
            // Mostrar nombre del usuario
            console.log('Usuario:', currentUser.name);
        }

        function logout() {
            if (confirm('¿Deseas cerrar sesión?')) {
                localStorage.removeItem('currentUser');
                window.location.href = 'login.html';
            }
        }

        // ==================== BOTONES DE LOGOUT ====================
        document.getElementById('logout-btn')?.addEventListener('click', logout);
        document.getElementById('logout-mobile')?.addEventListener('click', logout);

        const STORAGE_KEY_PEDIDOS = 'DeliBot_pedidos';

        const COLUMNAS = [
            { id: 'Recibido', titulo: 'Recibido', badgeColor: 'bg-blue-500' },
            { id: 'En preparación', titulo: 'En Preparación', badgeColor: 'bg-yellow-500' },
            { id: 'Listo', titulo: 'Listo', badgeColor: 'bg-green-500' },
            { id: 'Entregado', titulo: 'Entregado', badgeColor: 'bg-slate-500' }
        ];

        const formatCOP = (val) => new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(val);

        function loadChefOrders() {
            const stored = localStorage.getItem(STORAGE_KEY_PEDIDOS);
            if (!stored) return [];
            try {
                const parsed = JSON.parse(stored);
                return Array.isArray(parsed) ? parsed : [];
            } catch (error) {
                console.warn('Error al cargar pedidos de cocina:', error);
                return [];
            }
        }

        function saveChefOrders(orders) {
            localStorage.setItem(STORAGE_KEY_PEDIDOS, JSON.stringify(orders));
        }

        // ==================== TIMER FUNCTIONS ====================
        function calculateTimeElapsed(createdAt, hora, estado) {
            // No contar tiempo para órdenes entregadas
            if (estado === 'Entregado') {
                return 0;
            }
            
            let timestamp = null;
            
            // Si createdAt es un ISO string, usarlo
            if (createdAt && typeof createdAt === 'string' && createdAt.includes('T')) {
                timestamp = new Date(createdAt);
            } else if (hora && typeof hora === 'string') {
                // Si solo tenemos la hora (HH:MM), reconstruir desde hoy
                const [hours, minutes] = hora.split(':').map(Number);
                const now = new Date();
                timestamp = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hours, minutes);
                
                // Si la hora calculada es en el futuro, restar un día (de ayer)
                if (timestamp > new Date()) {
                    timestamp.setDate(timestamp.getDate() - 1);
                }
            }
            
            if (!timestamp) return 0;
            
            const elapsed = Math.floor((new Date() - timestamp) / 1000);
            return Math.max(0, elapsed);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${String(secs).padStart(2, '0')}`;
        }

        function getTimerState(seconds) {
            if (seconds < 15 * 60) return 'timer-green';
            if (seconds < 30 * 60) return 'timer-orange';
            return 'timer-red';
        }

        window.allowDrop = (ev) => {
            ev.preventDefault();
        };

        window.drag = (ev, id) => {
            ev.dataTransfer.setData("id", id);
        };

        window.drop = (ev, newState) => {
            ev.preventDefault();
            const id = ev.dataTransfer.getData("id");
            if (id) {
                let finalState = newState;
                if (newState === 'Listo') {
                    finalState = 'Entregado';
                }
                const orders = loadChefOrders();
                const updatedOrders = orders.map(order => {
                    if (order.id === id) {
                        return { ...order, estado: finalState };
                    }
                    return order;
                });
                saveChefOrders(updatedOrders);
                renderKanban();
            }
        };

        window.moveOrder = (id, curState) => {
            const idx = COLUMNAS.findIndex(c => c.id === curState);
            if (idx > -1 && idx < COLUMNAS.length - 1) {
                let nextState = COLUMNAS[idx + 1].id;
                if (curState === 'Listo') {
                    nextState = 'Entregado';
                }
                const orders = loadChefOrders();
                const updatedOrders = orders.map(order => {
                    if (order.id === id) {
                        return { ...order, estado: nextState };
                    }
                    return order;
                });
                saveChefOrders(updatedOrders);
                renderKanban();
            }
        };

        function renderKanban() {
            const orders = loadChefOrders();
            let html = '';

            COLUMNAS.forEach(col => {
                const peds = orders.filter(p => p.estado === col.id);
                let cardsHtml = '';

                peds.forEach(p => {
                    const elapsed = calculateTimeElapsed(p.createdAt, p.hora, p.estado);
                    const timerState = getTimerState(elapsed);
                    const timeString = formatTime(elapsed);
                    
                    const nextBtnHtml = col.id !== 'Entregado' ? `
                        <div class="absolute inset-0 bg-slate-900/5 backdrop-blur-[2px] opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center rounded-xl z-10 cursor-pointer" onclick="moveOrder('${p.id}', '${p.estado}')">
                            <button class="bg-primary text-white border border-primary-dark px-4 py-2 rounded-lg font-bold shadow-xl flex items-center transform transition-transform hover:scale-105 active:scale-95 text-sm">
                                Avanzar <svg class="ml-1" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
                            </button>
                        </div>
                    ` : '';

                    cardsHtml += `
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 relative group overflow-hidden hover:shadow-md transition-all cursor-grab active:cursor-grabbing" draggable="true" ondragstart="drag(event, '${p.id}')">
                            <div class="flex justify-between items-start mb-3 relative z-0">
                                <span class="font-bold text-slate-900 text-lg border-b-2 border-primary/20 leading-none pb-1">#${p.id.split('-')[1]}</span>
                                <span class="px-2 py-0.5 rounded text-[10px] uppercase tracking-wide bg-slate-100 text-slate-600 font-bold border border-slate-200">${p.origen}</span>
                            </div>
                            <div class="ticket-timer ${timerState}" data-order-id="${p.id}">
                                <svg class="timer-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <circle cx="12" cy="12" r="9"></circle>
                                    <polyline points="12 6 12 12 16 14"></polyline>
                                </svg>
                                <span class="timer-text">${timeString}</span>
                            </div>
                            <div class="text-sm text-slate-600 mb-4 space-y-1.5 relative z-0 mt-3">
                                ${p.items.map(i => `<div class="flex items-start gap-2"><span class="font-bold text-slate-800">${i.cantidad}x</span><span class="leading-tight">${i.nombre}</span></div>`).join('')}
                            </div>
                            ${p.nota ? `<div class="text-sm text-slate-500 mb-3 p-2 bg-yellow-50 rounded border border-yellow-100"><strong>Nota:</strong> ${p.nota}</div>` : ''}
                            <div class="flex justify-between items-center pt-3 border-t border-slate-100 relative z-0">
                                <span class="bg-slate-50 px-2 py-1 rounded text-xs text-slate-500 font-medium border border-slate-100">${p.hora}</span>
                                <span class="font-bold text-primary">${formatCOP(p.total)}</span>
                            </div>
                            ${nextBtnHtml}
                        </div>
                    `;
                });

                if (peds.length === 0) {
                    cardsHtml = `<div class="h-24 flex items-center justify-center text-sm font-medium text-slate-400 border-2 border-dashed border-slate-200 rounded-xl bg-slate-50/50">Sin pedidos</div>`;
                }

                html += `
                    <div class="flex flex-col bg-slate-50 rounded-2xl min-w-[300px] w-[300px] border border-slate-200 hide-scrollbar overflow-hidden h-full" ondragover="allowDrop(event)" ondrop="drop(event, '${col.id}')">
                        <div class="p-4 border-b border-slate-200 bg-white flex justify-between items-center sticky top-0 z-20">
                            <h3 class="font-bold text-slate-800 flex items-center gap-2">
                                <span class="w-2.5 h-2.5 rounded-full ${col.badgeColor} shadow-sm"></span>
                                ${col.titulo}
                            </h3>
                            <span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-lg text-xs font-bold shadow-sm border border-slate-200">${peds.length}</span>
                        </div>
                        <div class="flex-1 p-3 space-y-3 overflow-y-auto">
                            ${cardsHtml}
                        </div>
                    </div>
                `;
            });

            document.getElementById('kanban-board').innerHTML = html;
        }

        function renderOrders() {
            renderKanban();
        }

        window.addEventListener('storage', (event) => {
            if (event.key === STORAGE_KEY_PEDIDOS) {
                renderOrders();
            }
        });

        // ==================== TIMER UPDATE INTERVAL ====================
        function updateTimers() {
            const orders = loadChefOrders();
            const timerElements = document.querySelectorAll('.ticket-timer');
            
            timerElements.forEach(timerEl => {
                const orderId = timerEl.dataset.orderId;
                const order = orders.find(o => o.id === orderId);
                
                if (order) {
                    const elapsed = calculateTimeElapsed(order.createdAt, order.hora, order.estado);
                    const timerState = getTimerState(elapsed);
                    const timeString = formatTime(elapsed);
                    
                    // Update time display
                    const timerText = timerEl.querySelector('.timer-text');
                    if (timerText) timerText.textContent = timeString;
                    
                    // Update state class
                    timerEl.className = `ticket-timer ${timerState}`;
                }
            });
        }

        // Update timers every 1 second for real-time display
        setInterval(updateTimers, 1000);
        
        // Also update on first load
        setTimeout(updateTimers, 500);

        // ==================== INICIALIZACIÓN ====================
        checkSession();
        renderOrders();

        document.getElementById('refresh-btn')?.addEventListener('click', () => {
            renderOrders();
        });
    </script>
</body>

</html>
